name: fund_dca_discipline
display_name: 场外基金定投与加减仓纪律
track: fund
category: execution
description: 场外基金专属策略。场外基金无盘中价格、无挂单、无日内机制，动作只有买入、卖出、调整定投额三种（ADR-007 §2.2）。
holding_days_min: 7
allowed_actions:
  - 买入
  - 卖出
  - 调整定投额
  - 维持不动
rules:
  - 动作唯一性纪律：场外基金只能在买入、卖出、调整定投额、维持不动四者中选择，禁止出现任何中间形态的操作指令。判断依据是申赎按当日收盘净值成交，无盘口可挂。
  - 持有期红线：持有不满 7 日的份额禁止卖出，赎回费惩罚性计提（通常 1.5%）。任何卖出建议必须先校验目标份额的持有天数，低于红线即驳回该建议。
  - 观察依据纪律：场外基金无盘中净值，盘中观察只能使用代理指标（重仓股实时涨跌、相关指数涨跌幅），且输出中必须标注该结论为代理推断而非真实净值。
  - 单次操作幅度上限：单次买入或卖出金额不超过该基金当前持仓市值的 20%，避免一次性择时错误；超出部分拆分为多个交易日执行。
  - 定投连续性纪律：定投计划一经设定，非触发赎回费惩罚或明确风险信号，不得中断。临时下调定投额必须写明恢复条件与恢复日期。
  - QDII 特殊约束：QDII 基金净值确认与赎回到账均存在 T+2 以上延迟，卖出的资金短期内不可再投入股票轨，跨轨资金调度必须扣除该延迟。
  - 数据缺口纪律：基金重仓股行情或估值数据缺失时，不得以指数涨跌代理冒充真实净值表现，须显式标注缺口并降低建议幅度。