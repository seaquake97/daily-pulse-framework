name: six_networks
display_name: 十五五六张网战略配置
track: stock
category: strategic
description: 聚焦新型电网、算力网、通信网、水网、管网与物流网核心基础设施资产。
holdings_mapped:
  - sh600312
  - sz000791
  - sz563230
  - sz159611
  - sh600863
principles:
  - 产业逻辑：聚焦国家十五五规划核心基础设施导向，布局新型电网、算力网、通信网、水网、地下管网与物流网六张网骨干资产。
  - 算电协同：强化东数西算庆阳枢纽与和林格尔绿色数据中心集群的绿电消纳一体化绑定，把握算力与能源协同红利。
  - 底仓与做T分工：公用事业与电力底仓提供稳健现金流与安全垫，特高压设备龙头与卫星ETF成长弹性品种负责网格做T增厚超额收益。
rules:
  - 入场纪律：在产业政策催化初期或大盘深度调整回踩中长期均线支撑位时分批建仓，严禁追高建仓。
  - 加仓纪律：当标的出现技术支撑确认且算电负荷协同或装备招标排产订单超预期时分档加仓，单次加仓不超过规划仓位三分之一。
  - 止盈纪律：当单品种阶段涨幅过大、技术指标严重超买或浮盈达标时执行阶梯止盈，收益兑现后回流高股息防御底仓。
  - 跟踪纪律：持续跟踪庆阳与和林格尔算力节点绿电消纳率、国网特高压交直流排产进度以及低轨卫星星座发射计划。
