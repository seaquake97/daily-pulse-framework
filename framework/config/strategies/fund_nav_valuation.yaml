name: fund_nav_valuation
display_name: 场外基金净值与估值择时
track: fund
category: trend
description: 场外基金专属的趋势与估值研判规则。与股票轨隔离：只看净值序列与估值分位，不看盘中量价（ADR-007 §2.2）。
valuation_percentile_lookback_days: 250
rules:
  - 数据频率纪律：场外基金只有日频净值，任何依赖分钟线、日内量价、分时形态的判断在本轨一律不适用，禁止从股票轨直接搬运。
  - 估值分位为主锚：以跟踪指数的 PE 分位（滚动 250 交易日）作为加减仓的主判据，净值走势为辅证。分位处于历史低位时加大定投额，处于中高位时维持或小幅减少。
  - 趋势确认纪律：净值跌破年线（MA250）时暂停一切主动加仓，仅保留既定定投；重回年线上方才恢复主动加仓权限。此为场外基金专属的慢变量节奏，不适用日内择时。
  - 涨幅补偿反向适用：股票轨的强势趋势补偿逻辑（追高容忍）在场外基金轨禁止使用。场外基金无法日内纠错，追高后无法当日退出，因此强势期应维持而非加码。
  - 重仓股穿透观察：可通过季报重仓股与相关行业指数做前瞻性观察，但穿透数据存在季度滞后，必须标注为推断而非事实，且不得作为单独动作依据。
  - 分红再投纪律：基金分红默认再投时，不视为额外加仓，不计入单次操作幅度上限；但须在报告中显式列出再投金额，供持有人核对。
  - 汇率敞口纪律：QDII 基金的净值涨跌含汇率贡献，评估超额表现时必须剥离汇率因素，避免把汇率收益误判为选股能力。