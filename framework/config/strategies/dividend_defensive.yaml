name: dividend_defensive
display_name: 高股息防御与收息底仓
track: stock
category: defensive
description: 深度破净、股息率>4%、现金流充沛的防御收息压舱石。
holdings_mapped:
  - sz000429
  - sh600919
  - sz003816
  - sh518600
rules:
  - 股息率门槛：标的近12个月股息率或最新分红预案倒推股息率原则上不低于4.0%，且企业近三年经营性现金流净额需持续覆盖分红现金支出。
  - 深度破净安全垫：金融及重资产公用事业标的优先选取市净率PB长期处于历史低位或深度破净标的，构筑充沛的下行安全边际。
  - 底仓锁定不抛：将防御性底仓视为产生持续分红现金流的长期生产资料，坚决执行锁仓原则，不参与短线博弈与日内做T。
  - 深踩回补观察区间：当标的因系统性恐慌出现非理性下挫，进入超跌高赔率观察区间（如股息率攀升至5.5%以上或技术指标深度超卖）时，启动长线分批回补计划。
  - 宏观对冲与再平衡：将上海金作为对抗信用货币贬值与地缘宏观波动的压舱资产，年度结算时将分红与溢价收益适度再平衡至低估值防御标的。
