name: grid_trading
display_name: 条件单智能网格做T
category: execution
description: 适用于高波动弹性品种的底仓留存与日内/波段网格做T。
step_ratio_default: 0.025
execution_levels:
  - 卖二买二
  - 卖三买三
rules:
  - 基准价设定：以近期箱体中枢、前收盘价或重要均线支撑位（如MA20）作为初始基准价，每完成完整买卖闭环或出现趋势突破时动态更新校准。
  - 步长阶梯：默认步长设为2.5%（step_ratio_default 0.025），结合标的历史振幅与ATR动态调节，低波动期可收敛至2.0%，高波动期可放宽至3.0%至3.5%。
  - 最小底仓红线停卖：严格设定每个网格标的的底仓硬约束红线（如华能蒙电底仓1000股、平高电气底仓300股），触及底仓红线时系统强制锁定卖单权限，绝对禁止击穿底仓。
  - 挂单撤单纪律：严格依托券商条件单执行预设网格，盘中价格未触发时不作人工情绪化干预；遇大盘极端单边下跌或突发黑天鹅时及时暂停网格并撤除未成交买单。
  - 仓位管理纪律：单笔做T数量受限于可用流动资金与持仓上限，逢低分档买入、逢高分档卖出，做T仓位与长线底仓保持账户级逻辑隔离。
